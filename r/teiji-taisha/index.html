<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>定時退社 ルールブック | Mottainai Games</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #0b0c10;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --line: rgba(255,255,255,0.14);
      --card: #12141c;
      --accent: #7dd3fc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 16px 12px 40px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
    }
    h1 {
      margin: 4px 0 0;
      font-size: 1.35rem;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .links a {
      display: inline-block;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      background: rgba(255,255,255,0.03);
      font-size: 0.9rem;
    }
    .links a:hover {
      background: rgba(125,211,252,0.1);
      border-color: var(--accent);
    }
    .pages {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    figure {
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }
    figure img {
      display: block;
      width: 100%;
      height: auto;
    }
    figcaption {
      padding: 8px 12px;
      font-size: 0.8rem;
      color: var(--muted);
      background: var(--card);
      border-top: 1px solid var(--line);
    }
    footer {
      margin-top: 24px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <p class="brand">Mottainai Games</p>
        <h1>定時退社 ルールブック</h1>
      </div>
      <nav class="links" aria-label="関連リンク">
        <a href="../../game.html?id=game-1">ゲーム詳細</a>
        <a href="../../index.html">公式サイト</a>
      </nav>
    </header>

    <main class="pages" aria-label="ルールブック画像">
      <figure>
        <img src="1.png" alt="定時退社 ルールブック 1ページ目" width="2150" height="3035" />
        <figcaption>1 / 2</figcaption>
      </figure>
      <figure>
        <img src="2.png" alt="定時退社 ルールブック 2ページ目" width="2150" height="3035" />
        <figcaption>2 / 2</figcaption>
      </figure>
    </main>

    <footer>
      © Mottainai Games　／　このページのURLはQR配布用の固定アドレスです。
    </footer>
  </div>
</body>
